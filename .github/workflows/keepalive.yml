# Render's free plan sleeps after 15 idle minutes; this keeps Kith (and its Telegram bot) awake.
# Set the repo variable KITH_URL to the Render URL, e.g. https://kith.onrender.com
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.KITH_URL != '' }}
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.KITH_URL }}/health"
